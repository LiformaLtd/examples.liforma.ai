<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Basic embed — Liforma example</title>
		<meta
			name="description"
			content="Minimal Liforma experience embed: one experience id, one web component."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<div class="app-shell">
			<header class="app-header">
				<div class="header-inner">
					<div>
						<p class="eyebrow">Liforma example</p>
						<h1>Basic embed</h1>
					</div>
					<a
						class="docs-link"
						href="https://examples.liforma.ai/examples/basic-embed"
						target="_blank"
						rel="noopener noreferrer"
					>
						Example docs
					</a>
				</div>
			</header>

			<main class="app-main">
				<div class="stage">
					<p class="lede">
						This example shows a simple Experience embedded in a div on a web page.
					</p>
					<!-- Liforma SDK: registers <liforma-experience> and window.Liforma.
					     Normally put this in <head>; kept here so the embed is one readable block. -->
					<script src="https://cdn.liforma.ai/sdk/v2/client.js"></script>
					<div class="experience" aria-label="Liforma experience embed">
						<liforma-experience
							experience-id="exp_01EXAMPLES_COFFEE_BARISTA"
						></liforma-experience>
					</div>
				</div>
			</main>
		</div>
	</body>
</html>
